<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FRESH STAR CUP Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=M+PLUS+1p:wght@800;900&display=swap" rel="stylesheet">
<style>
  /*
    使い方（OBS ブラウザソース 1920x1080）
    - overlay.html            … 左枠に雀魂を iframe 表示
    - ルール表示ボタンは 1080px より下にある。OBS ではソースの高さを 1140 にして
      下 60px をクロップ（Alt+ドラッグ or フィルタ「クロップ」）し、「対話」から操作する
    - overlay.html?game=0     … 左枠を透明な「穴」にする（下に雀魂のウィンドウキャプチャ等を置く）
    - overlay.html?url=...    … iframe に読み込むURLを変更
    2枚重ね（実況解説枠の中にも背景を出す）
    - overlay.html?layer=front … 背景なし（枠・ロゴ・雀魂・下帯・操作ボタン）→ カメラより上
    - overlay.html?layer=back  … 動く背景だけ → カメラより下（一番下）
  */
  :root {
    --blue-deep: #0b1fb8;
    --blue: #1f5bff;
    --cyan: #49d4ff;
    --yellow: #ffd21f;
    --pink: #ff4fa3;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
  }
  #root {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1140px;
    transform-origin: 0 0;
  }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: "M PLUS 1p", sans-serif;
  }

  /* ===== ルール画像 ===== */
  #rule {
    position: absolute; left: 50px; top: 62px; width: 1424px; height: 801px;
    opacity: 0; transform: translateY(-1100px) rotate3d(1, 1, 1, 140deg);
    transition: transform .5s ease-in-out, opacity .5s ease-in-out;
    pointer-events: none;
  }
  #rule.show { opacity: 1; transform: none; }

  /* ===== 下帯（対局前の穴埋め） ===== */
  #band {
    position: absolute; left: 0; top: 930px; width: 1920px; height: 150px;
    background: linear-gradient(180deg, rgba(14,24,110,.92), rgba(8,12,70,.96));
    border-top: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--cyan), var(--blue) 40%, var(--yellow) 75%, var(--pink)) 1;
    box-shadow: 0 -6px 24px rgba(40,120,255,.5);
    transition: transform .6s ease-in-out;
    overflow: hidden;
  }
  #band.hide { transform: translateY(160px); }
  #band .main {
    height: 100px; display: flex; align-items: center; gap: 28px; padding: 0 44px;
  }
  #band .tag {
    font: italic 30px "Anton", sans-serif; letter-spacing: 2px; color: #0b1a7a;
    background: linear-gradient(90deg, var(--yellow), #ffe98a);
    padding: 6px 34px 6px 22px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
  }
  #band .sub { font-size: 34px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px rgba(73,212,255,.6); }
  #band .title {
    font-size: 56px; font-weight: 900; color: #fff; letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(80,160,255,.9), 3px 3px 0 #0a1a8a;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .75; } }
  #band .ticker {
    height: 46px; background: rgba(0,0,0,.35); border-top: 1px solid rgba(120,200,255,.35);
    overflow: hidden; white-space: nowrap; position: relative;
  }
  #band .ticker span {
    position: absolute; top: 0; line-height: 46px; left: 100%;
    font-size: 26px; font-weight: 800; color: #e6f3ff;
    animation: ticker 30s linear infinite;
  }
  @keyframes ticker { to { transform: translateX(calc(-100% - 1920px)); } }

  /* ===== 操作パネル（1080px より下 = 配信には映らない） ===== */
  #controls {
    position: absolute; left: 0; top: 1080px; width: 1920px; height: 60px;
    background: #222; display: flex; align-items: center; gap: 10px; padding: 0 20px;
    box-sizing: border-box; font: 700 20px sans-serif; color: #ccc;
  }
  #controls button {
    font: 700 20px sans-serif; color: #fff; background: #955; border: 0;
    padding: 8px 18px; cursor: pointer;
  }
  #controls input {
    font: 16px sans-serif; padding: 6px 8px; border: 0; background: #444; color: #fff;
  }
  #controls .sep { width: 2px; height: 36px; background: #555; margin: 0 10px; }
  #controls button.active { background: #d44; outline: 2px solid #fff; }

  /* ===== 2枚重ねモード ===== */
  body.layer-front #bg { display: none; }
  body.layer-back #stage > :not(#bg), body.layer-back #controls { display: none; }
  body.layer-back #bg { -webkit-mask-image: none; mask-image: none; }

  .nebula {
    position: absolute; border-radius: 50%;
    filter: blur(70px); mix-blend-mode: screen; opacity: .75;
    will-change: transform;
  }
  .n1 { width: 900px; height: 600px; left: 700px; top: 150px;
        background: radial-gradient(circle, rgba(70,230,255,.9), rgba(40,140,255,.35) 45%, transparent 70%);
        animation: drift1 38s ease-in-out infinite alternate; }
  .n2 { width: 800px; height: 700px; left: -150px; top: 300px;
        background: radial-gradient(circle, rgba(60,170,255,.8), rgba(90,60,255,.35) 50%, transparent 72%);
        animation: drift2 46s ease-in-out infinite alternate; }
  .n3 { width: 700px; height: 500px; left: 1250px; top: 80px;
        background: radial-gradient(circle, rgba(255,90,180,.55), rgba(160,60,255,.3) 50%, transparent 72%);
        animation: drift3 52s ease-in-out infinite alternate; }
  .n4 { width: 600px; height: 450px; left: 450px; top: 200px;
        background: radial-gradient(circle, rgba(255,120,90,.4), rgba(255,60,160,.2) 50%, transparent 72%);
        animation: drift2 60s ease-in-out infinite alternate-reverse; }
  .n5 { width: 1000px; height: 500px; left: 300px; top: 650px;
        background: radial-gradient(circle, rgba(120,80,255,.6), transparent 70%);
        animation: drift1 55s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-120px,60px) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(140px,-70px) scale(1.1); } }
  @keyframes drift3 { from { transform: translate(0,0) scale(1.05); } to { transform: translate(-90px,90px) scale(.95); } }
  #stars { position: absolute; inset: 0; }

  /* ===== ゲーム枠 ===== */
  #game {
    position: absolute; left: 50px; top: 62px; width: 1424px; height: 801px;
    background: #000;
      }
  #game iframe { width: 100%; height: 100%; border: 0; display: block; }
  body.hole #game { display: none; }

  .frame { position: absolute; pointer-events: none; display: block; }

  /* ===== ロゴ ===== */
  #logo { position: absolute; left: 1530px; top: 55px; width: 375px; text-align: center; }
  #logo img { width: 100%; display: block; filter: drop-shadow(0 0 10px rgba(80,180,255,.6)); }
  #logoText .title {
    font-family: "Anton", sans-serif; font-size: 58px; white-space: nowrap; line-height: 1;
    letter-spacing: -1px; font-style: italic; transform: skewX(-6deg);
    background: linear-gradient(180deg, #fff 0%, #cfefff 45%, #6fc6ff 55%, #eaf8ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #1236d8;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(3px 4px 0 #0a1a8a) drop-shadow(0 0 12px rgba(80,180,255,.8));
    position: relative; display: inline-block;
  }
  #logoText .title .star {
    position: absolute; left: 58%; top: -20px; font-size: 40px; font-style: normal;
    color: var(--yellow); -webkit-text-stroke: 0; background: none;
    filter: drop-shadow(0 0 6px #fff38a);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  #logoText .sub {
    margin-top: 6px; font-size: 15px; font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 0 0 4px #1a2cff, 0 0 8px #1a2cff;
  }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(1.2) rotate(15deg); opacity: .85; } }

  #sponsor {
    position: absolute; left: 1741px; top: 190px; width: 116px; height: 70px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(0,0,0,.35);
  }
  #sponsorLabel {
    position: absolute; left: 1541px; top: 190px; width: 188px; height: 70px;
    display: flex; align-items: center; justify-content: flex-end;
    font-family: "Anton", sans-serif; font-size: 24px; font-style: italic; letter-spacing: 1px;
    color: #fff; text-shadow: 0 0 6px #1a4cff, 0 0 12px #1a4cff, 2px 2px 0 #0a1a8a;
  }
  #sponsor img { max-width: 100%; max-height: 100%; }
  #sponsor .fallback { font: 900 16px "Anton", sans-serif; color: #111; }

</style>
</head>
<body>
<div id="root">
<div id="stage">
  <div id="bg">
    <div class="nebula n5"></div>
    <div class="nebula n2"></div>
    <div class="nebula n1"></div>
    <div class="nebula n4"></div>
    <div class="nebula n3"></div>
    <canvas id="stars" width="1920" height="1080"></canvas>

<script>
/* ---------- 設定 ---------- */
const params = new URLSearchParams(location.search);
const GAME_URL = params.get('url') || 'https://game.mahjongsoul.com/';
if (params.get('game') === '0') document.body.classList.add('hole');
const LAYER = params.get('layer');   // 'front' | 'back' | null
if (LAYER) document.body.classList.add('layer-' + LAYER);
if (params.get('game') !== '0' && LAYER !== 'back') document.getElementById('gameFrame').src = GAME_URL;

/* ---------- 画面フィット（OBSは1920x1080なら等倍） ---------- */
function fit() {
  const s = innerWidth / 1920;
  document.getElementById('root').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- ルール表示 ---------- */
document.querySelectorAll('#controls button[data-rule]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#controls button[data-rule]').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('rule').classList.toggle('show', b.dataset.rule === '1');
});

/* ---------- 下帯 ---------- */
const bandDefaults = {
  inTag: 'NEXT MATCH',
  inSub: '予選 第1試合',
  inTitle: 'まもなく対局開始！',
  inTicker: '★ FRESH STAR CUP ★　Sponsored by Vision8　／　配信をお楽しみください！'
};
const bandMap = { inTag: 'bandTag', inSub: 'bandSub', inTitle: 'bandTitle', inTicker: 'bandTicker' };
function load(k, d) { try { return localStorage.getItem('fsc_' + k) ?? d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('fsc_' + k, v); } catch (e) {} }
for (const id in bandMap) {
  const input = document.getElementById(id), out = document.getElementById(bandMap[id]);
  input.value = load(id, bandDefaults[id]);
  const apply = () => { out.textContent = input.value; save(id, input.value); };
  input.oninput = apply; apply();
}
const band = document.getElementById('band'), bandBtn = document.getElementById('bandToggle');
function setBand(show) {
  band.classList.toggle('hide', !show);
  bandBtn.classList.toggle('active', show);
  bandBtn.textContent = show ? '表示中' : '非表示';
  save('band', show ? '1' : '0');
}
bandBtn.onclick = () => setBand(band.classList.contains('hide'));
setBand(load('band', '1') === '1');

/* ---------- 星（キャンバス） ---------- */
const cv = document.getElementById('stars');
const ctx = cv.getContext('2d');
const stars = [];
for (let i = 0; i < 420; i++) {
  const big = Math.random() < 0.06;
  stars.push({
    x: Math.random() * 1920, y: Math.random() * 1080,
    r: big ? 1.4 + Math.random() * 1.6 : 0.4 + Math.random() * 1.0,
    a: 0.3 + Math.random() * 0.7,
    tw: 0.5 + Math.random() * 2.5, ph: Math.random() * Math.PI * 2,
    vx: 2 + Math.random() * 4, // px/秒 ゆっくり流れる
    hue: Math.random() < 0.2 ? (Math.random() < 0.5 ? 190 : 320) : 0,
    big
  });
}
let meteor = null, nextMeteor = 4;
let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  ctx.clearRect(0, 0, 1920, 1080);

  for (const s of stars) {
    s.x += s.vx * dt;
    if (s.x > 1925) s.x = -5;
    const alpha = s.a * (0.55 + 0.45 * Math.sin(t * s.tw + s.ph));
    ctx.fillStyle = s.hue ? `hsla(${s.hue},100%,85%,${alpha})` : `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.big) {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
      g.addColorStop(0, `rgba(200,230,255,${alpha * 0.5})`); g.addColorStop(1, 'rgba(200,230,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 流れ星
  nextMeteor -= dt;
  if (!meteor && nextMeteor <= 0) {
    meteor = { x: 400 + Math.random() * 1400, y: -20 + Math.random() * 300, life: 0 };
    nextMeteor = 6 + Math.random() * 8;
  }
  if (meteor) {
    meteor.life += dt;
    const p = meteor.life / 1.1;
    const hx = meteor.x - p * 520, hy = meteor.y + p * 260;
    const g = ctx.createLinearGradient(hx, hy, hx + 160, hy - 80);
    const a = Math.sin(Math.min(1, p) * Math.PI);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 160, hy - 80); ctx.stroke();
    if (p >= 1) meteor = null;
  }

  requestAnimationFrame(frame);
}
if (LAYER !== 'front') requestAnimationFrame(frame); // 前面レイヤーは星を描かない
</script>
